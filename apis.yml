apis:
- aid: linkable-networks-collinson-group:mylinkables-consumer-api
  name: MyLinkables Consumer API
  description: 'RESTful consumer API for building applications on top of the Linkable card-linked-offer
    platform. Per the provider developer page it exposes consumer registration, view and opt-out
    (consumerapi/consumer); offer retrieval by state - available, linked, redeemed and reserved
    (consumerapi/offers/*); and listing, adding, updating and removing the payment cards an offer is linked
    to (consumerapi/accounts). Adding and updating cards is restricted to PCI-compliant partners.
    Authentication is OAuth 2.0 Resource Owner Password Credentials (RFC 6749 section 4.3); responses are
    available as JSON or XML; current version 1.0. Documentation and credentials are issued on request by
    email - no public reference or machine-readable specification is published.'
