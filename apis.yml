aid: linkable-networks-collinson-group
name: Linkable Networks (Collinson Group)
description: 'Linkable Networks, Inc. is a Boston-based card-linked-offers (CLO) and SKU-linked-offers platform
  that lets consumers attach digital offers directly to the credit and debit cards already in their wallet.
  When a linked card is used for a qualifying purchase on the Visa, MasterCard, American Express or PayPal
  rails, the Linkable platform receives the transaction, optionally confirms item-level detail through the
  on-premises Linkable SKU Matcher, and delivers the savings back to the cardholder as a statement credit,
  eGift, points or miles - with no POS integration, no additional hardware or software, no punch cards and
  no employee training. The company sells to brands and retailers (product/SKU-level promotions funded with
  trade and co-op dollars), to loyalty program operators (single-purchase, multi-visit and aggregate-spend
  reward mechanics layered on an existing program), and to publishers and app developers, who integrate the
  consumer-facing MyLinkables REST API to display offers, link them to a cardholder, register consumers,
  manage linked payment accounts and track redemption. Linkable Networks is associated with the Collinson
  Group, the privately-owned global travel, loyalty and insurance operator behind Priority Pass, and was
  surfaced through the Bain Capital Ventures portfolio.'
